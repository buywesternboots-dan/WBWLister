<!doctype html>
<html><body style="width:260px;font:14px system-ui;padding:12px;display:flex;flex-direction:column;gap:8px">
  <input id="server" placeholder="WBW server URL (https://…vercel.app)">
  <input id="password" type="password" placeholder="App password">
  <input id="seller" placeholder="Your WBW seller name (not the FB seller)">
  <input id="profileUrl" placeholder="Marketplace profile link">
  <button id="profile">Import all from this profile</button>
  <button id="sync">Sync with this profile</button>
  <button id="listing">Add this listing</button>
  <p id="status" style="margin:0;color:#555"></p>
  <progress id="bar" style="width:100%;display:none"></progress><small id="barLabel" style="color:#555"></small>
  <pre id="log" style="margin:0;font-size:11px;white-space:pre-wrap;color:#555;max-height:200px;overflow:auto"></pre>
  <script src="popup.js"></script>
</body></html>
